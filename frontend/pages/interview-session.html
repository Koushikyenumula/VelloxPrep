<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI Interview Session — answer AI-generated questions one by one within a timed session.">
    <title>Interview Session — VelloxPrep</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Dashboard layout (sidebar, topbar, orbs) -->
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/sidebar.css">

    <!-- Auth Guard and Fetch Interceptor -->
    <script src="../js/auth.js"></script>

    <style>
        /* ═══════════════════════════════════════════════════════════════
           INTERVIEW SESSION — Page-Specific Styles
           ═══════════════════════════════════════════════════════════════ */

        /* ── Session Header Bar ─────────────────────────────────────── */
        .session-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .session-meta {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .session-badge {
            font-size: 0.72rem;
            font-weight: 600;
            padding: 0.3rem 0.7rem;
            border-radius: 20px;
            white-space: nowrap;
        }

        .badge-skill {
            background: hsla(230, 80%, 60%, 0.12);
            color: var(--primary-light);
        }

        .badge-difficulty-easy {
            background: hsla(145, 65%, 45%, 0.12);
            color: var(--success);
        }

        .badge-difficulty-medium {
            background: hsla(38, 92%, 55%, 0.12);
            color: var(--warning);
        }

        .badge-difficulty-hard {
            background: hsla(0, 75%, 60%, 0.12);
            color: var(--danger);
        }

        /* ── Timer ──────────────────────────────────────────────────── */
        .timer-display {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--bg-card);
            
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 0.55rem 1rem;
            font-variant-numeric: tabular-nums;
        }

        .timer-icon {
            font-size: 1.1rem;
            color: var(--text-muted);
        }

        .timer-value {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 0.02em;
        }

        .timer-display.warning {
            border-color: hsla(38, 92%, 55%, 0.35);
        }

        .timer-display.warning .timer-icon,
        .timer-display.warning .timer-value {
            color: var(--warning);
        }

        .timer-display.danger {
            border-color: hsla(0, 75%, 60%, 0.35);
            animation: timerPulse 1s ease-in-out infinite;
        }

        .timer-display.danger .timer-icon,
        .timer-display.danger .timer-value {
            color: var(--danger);
        }

        @keyframes timerPulse {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0.6; }
        }

        /* ── Progress Bar ───────────────────────────────────────────── */
        .progress-wrapper {
            margin-bottom: 1.5rem;
        }

        .progress-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .progress-label {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .progress-count {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .progress-track {
            height: 6px;
            background: hsla(230, 30%, 40%, 0.15);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 3px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            width: 0%;
        }

        /* ── Question Card ──────────────────────────────────────────── */
        .question-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 2rem;
            box-shadow: var(--shadow-card);
            margin-bottom: 1.5rem;
            animation: cardSlideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes cardSlideIn {
            from { opacity: 0; transform: translateX(20px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        .question-number {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--primary-light);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 1rem;
        }

        .question-number-badge {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            color: #fff;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-primary);
            line-height: 1.65;
            margin-bottom: 0;
        }

        /* ── Answer Area ────────────────────────────────────────────── */
        .answer-section {
            margin-bottom: 1.5rem;
        }

        .answer-label {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 0.6rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .answer-textarea {
            width: 100%;
            min-height: 160px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: var(--font-family);
            font-size: 0.925rem;
            font-weight: 400;
            padding: 1rem 1.15rem;
            resize: vertical;
            transition: var(--transition);
            box-shadow: 0 2px 6px hsla(230, 40%, 10%, 0.20);
            line-height: 1.6;
        }

        .answer-textarea::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }

        .answer-textarea:hover {
            border-color: hsla(230, 30%, 50%, 0.40);
            background: var(--bg-hover);
        }

        .answer-textarea:focus {
            background: var(--bg-hover);
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px hsla(230, 80%, 60%, 0.15),
                        0 2px 6px hsla(230, 40%, 10%, 0.20);
            outline: none;
        }

        .answer-char-count {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: right;
            margin-top: 0.35rem;
        }

        /* ── Evaluation Feedback ────────────────────────────────────── */
        .evaluation-panel {
            background: hsla(230, 30%, 18%, 0.50);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 1.25rem;
            margin-bottom: 1.5rem;
            animation: feedbackSlide 0.4s ease both;
        }

        @keyframes feedbackSlide {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .eval-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.75rem;
        }

        .eval-title {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .eval-score-badge {
            font-size: 0.85rem;
            font-weight: 700;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
        }

        .score-high {
            background: hsla(145, 65%, 45%, 0.12);
            color: var(--success);
        }

        .score-mid {
            background: hsla(38, 92%, 55%, 0.12);
            color: var(--warning);
        }

        .score-low {
            background: hsla(0, 75%, 60%, 0.12);
            color: var(--danger);
        }

        .eval-feedback {
            font-size: 0.88rem;
            color: var(--text-secondary);
            line-height: 1.65;
        }

        /* ── Navigation Buttons ─────────────────────────────────────── */
        .nav-buttons {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .btn-nav {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-size: 0.88rem;
            font-weight: 500;
            padding: 0.65rem 1.25rem;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-nav:hover {
            background: var(--bg-hover);
            border-color: hsla(230, 30%, 50%, 0.35);
            color: var(--text-primary);
        }

        .btn-nav:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-submit-answer {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border: none;
            border-radius: var(--radius-sm);
            color: #fff;
            font-size: 0.88rem;
            font-weight: 600;
            padding: 0.65rem 1.5rem;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-submit-answer::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg,
                hsla(0, 0%, 100%, 0.12),
                hsla(0, 0%, 100%, 0));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .btn-submit-answer:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 18px hsla(245, 80%, 55%, 0.30);
            color: #fff;
        }

        .btn-submit-answer:hover::before { opacity: 1; }

        .btn-submit-answer:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-finish {
            background: linear-gradient(135deg, var(--success), hsl(155, 70%, 40%));
        }

        .btn-finish:hover {
            box-shadow: 0 4px 18px hsla(145, 65%, 45%, 0.30);
        }

        .btn-loader-sm {
            display: inline-flex;
            align-items: center;
        }

        .nav-spacer { flex: 1; }

        /* ── Question Dots Navigation ───────────────────────────────── */
        .question-dots {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .q-dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            background: transparent;
            color: var(--text-muted);
            font-size: 0.72rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .q-dot:hover {
            border-color: var(--primary-light);
            color: var(--primary-light);
        }

        .q-dot.active {
            border-color: var(--primary);
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff;
            box-shadow: 0 2px 10px hsla(245, 80%, 55%, 0.30);
        }

        .q-dot.answered {
            border-color: var(--success);
            background: hsla(145, 65%, 45%, 0.15);
            color: var(--success);
        }

        .q-dot.answered.active {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff;
            border-color: var(--primary);
        }

        /* ── Alert ──────────────────────────────────────────────────── */
        #alertContainer .alert {
            background: hsla(0, 75%, 60%, 0.12);
            border: 1px solid hsla(0, 75%, 60%, 0.25);
            color: hsl(0, 70%, 72%);
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            padding: 0.75rem 1rem;
            animation: alertFadeIn 0.3s ease;
        }

        #alertContainer .alert-success {
            background: hsla(145, 65%, 45%, 0.12);
            border-color: hsla(145, 65%, 45%, 0.25);
            color: hsl(145, 55%, 65%);
        }

        #alertContainer .alert-warning {
            background: hsla(38, 92%, 55%, 0.12);
            border-color: hsla(38, 92%, 55%, 0.25);
            color: hsl(38, 80%, 65%);
        }

        @keyframes alertFadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Loading Skeleton ───────────────────────────────────────── */
        .skeleton-question {
            height: 220px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            position: relative;
            overflow: hidden;
            margin-bottom: 1.5rem;
        }

        .skeleton-answer {
            height: 180px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            position: relative;
            overflow: hidden;
        }

        .skeleton-question::after,
        .skeleton-answer::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                90deg,
                transparent 0%,
                hsla(230, 30%, 40%, 0.06) 40%,
                hsla(230, 30%, 40%, 0.10) 50%,
                hsla(230, 30%, 40%, 0.06) 60%,
                transparent 100%
            );
            animation: shimmer 1.8s ease-in-out infinite;
        }

        /* ── Session Complete Panel ─────────────────────────────────── */
        .session-complete {
            text-align: center;
            padding: 3rem 2rem;
            background: var(--bg-card);
            
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            animation: cardSlideIn 0.5s ease both;
        }

        .complete-icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, var(--success), hsl(155, 70%, 40%));
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: #fff;
            margin-bottom: 1.25rem;
            box-shadow: 0 4px 24px hsla(145, 65%, 45%, 0.30);
        }

        .complete-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.4rem;
        }

        .complete-subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
        }

        .btn-back-dashboard {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border: none;
            border-radius: var(--radius-sm);
            color: #fff;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 0.7rem 1.75rem;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-back-dashboard:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 18px hsla(245, 80%, 55%, 0.30);
            color: #fff;
        }

        /* ── Responsive ─────────────────────────────────────────────── */
        @media (max-width: 767.98px) {
            .session-header { flex-direction: column; align-items: flex-start; }
            .question-card { padding: 1.5rem; }
            .question-text { font-size: 1rem; }
            .answer-textarea { min-height: 130px; }
            .nav-buttons { justify-content: center; }
            .nav-spacer { display: none; }
        }

        @media (max-width: 575.98px) {
            .q-dot { width: 28px; height: 28px; font-size: 0.65rem; }
            .timer-value { font-size: 0.92rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            .question-card,
            .evaluation-panel,
            .session-complete,
            .skeleton-question::after,
            .skeleton-answer::after {
                animation: none !important;
            }
            .timer-display.danger { animation: none !important; }
            .btn-submit-answer:hover,
            .btn-back-dashboard:hover { transform: none; }
        }
    </style>
</head>
<body>

    <!-- ── Animated Background Orbs ──────────────────────────────────── -->
    <div class="bg-grid" aria-hidden="true"></div>

    <!-- ── Sidebar ───────────────────────────────────────────────────── -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- ── Sidebar Overlay (Mobile) ──────────────────────────────────── -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- ── Main Content ──────────────────────────────────────────────── -->
    <div class="main-content" id="mainContent">

        <!-- ── Top Navbar ────────────────────────────────────────────── -->
        <header class="topbar">
            <div class="topbar-left">
                <button class="topbar-toggle d-lg-none" id="sidebarToggleBtn" aria-label="Toggle sidebar">
                    <i class="bi bi-list"></i>
                </button>
                <div>
                    <h1 class="topbar-title">Interview Session</h1>
                    <p class="topbar-subtitle" id="topbarSubtitle">Loading session…</p>
                </div>
            </div>
            <div class="topbar-right">
                <!-- Timer -->
                <div class="timer-display" id="timerDisplay">
                    <i class="bi bi-clock timer-icon"></i>
                    <span class="timer-value" id="timerValue">30:00</span>
                </div>
            </div>
        </header>

        <!-- ── Page Content ──────────────────────────────────────────── -->
        <div class="page-content">

            <!-- Alert Area -->
            <div id="alertContainer" class="mb-3" role="alert" aria-live="polite"></div>

            <!-- ── Loading Skeleton ──────────────────────────────────── -->
            <div id="loadingSkeleton">
                <div class="skeleton-question"></div>
                <div class="skeleton-answer"></div>
            </div>

            <!-- ── Session Content (hidden until loaded) ─────────────── -->
            <div id="sessionContent" class="d-none">

                <!-- Session Header (Skill / Difficulty badges) -->
                <div class="session-header" id="sessionHeader">
                    <div class="session-meta" id="sessionMeta"></div>
                </div>

                <!-- Question Dots Navigation -->
                <div class="question-dots" id="questionDots"></div>

                <!-- Progress Bar -->
                <div class="progress-wrapper">
                    <div class="progress-info">
                        <span class="progress-label">Progress</span>
                        <span class="progress-count" id="progressCount">0 / 0 answered</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>

                <!-- Question Card -->
                <div class="question-card" id="questionCard">
                    <div class="question-number" id="questionNumber">
                        <span class="question-number-badge" id="questionBadge">1</span>
                        Question <span id="questionCurrent">1</span> of <span id="questionTotal">0</span>
                    </div>
                    <p class="question-text" id="questionText"></p>
                </div>

                <!-- Evaluation Feedback (shown after submit) -->
                <div class="evaluation-panel d-none" id="evaluationPanel">
                    <div class="eval-header">
                        <span class="eval-title"><i class="bi bi-stars"></i> AI Feedback</span>
                        <span class="eval-score-badge" id="evalScoreBadge">0%</span>
                    </div>
                    <p class="eval-feedback" id="evalFeedback"></p>
                </div>

                <!-- Answer Area -->
                <div class="answer-section" id="answerSection">
                    <label for="answerTextarea" class="answer-label">
                        <i class="bi bi-pencil-square"></i> Your Answer
                    </label>
                    <textarea
                        class="answer-textarea"
                        id="answerTextarea"
                        placeholder="Type your answer here…"
                        maxlength="5000"
                    ></textarea>
                    <div class="answer-char-count">
                        <span id="charCount">0</span> / 5000
                    </div>
                </div>

                <!-- Navigation Buttons -->
                <div class="nav-buttons">
                    <button class="btn-nav" id="prevBtn" disabled>
                        <i class="bi bi-chevron-left"></i> Previous
                    </button>
                    <div class="nav-spacer"></div>
                    <button class="btn-submit-answer" id="submitAnswerBtn">
                        <span class="btn-text" id="submitBtnText">
                            <i class="bi bi-send-fill"></i> Submit Answer
                        </span>
                        <span class="btn-loader-sm d-none" id="submitBtnLoader">
                            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                            Evaluating…
                        </span>
                    </button>
                    <button class="btn-nav" id="nextBtn">
                        Next <i class="bi bi-chevron-right"></i>
                    </button>
                </div>
            </div>

            <!-- ── Session Complete Panel ─────────────────────────────── -->
            <div id="sessionComplete" class="d-none">
                <div class="session-complete">
                    <div class="complete-icon">
                        <i class="bi bi-check-lg"></i>
                    </div>
                    <h2 class="complete-title">Session Complete!</h2>
                    <p class="complete-subtitle" id="completeSubtitle">You answered all questions. Great job!</p>
                    <div class="d-flex flex-column flex-sm-row justify-content-center gap-3">
                        <a href="dashboard.html" class="btn-back-dashboard">
                            <i class="bi bi-grid-1x2-fill"></i> Back to Dashboard
                        </a>
                        <a href="#" id="viewResultsBtn" class="btn-back-dashboard" style="background: linear-gradient(135deg, var(--primary), var(--accent)); border: none; box-shadow: 0 4px 15px hsla(230, 80%, 60%, 0.35);">
                            <i class="bi bi-bar-chart-line-fill"></i> View Results
                        </a>
                    </div>
                </div>
            </div>

            <!-- ── Error State ───────────────────────────────────────── -->
            <div id="errorState" class="d-none">
                <div class="session-complete">
                    <div class="complete-icon" style="background: linear-gradient(135deg, var(--danger), hsl(0, 65%, 45%));">
                        <i class="bi bi-exclamation-triangle"></i>
                    </div>
                    <h2 class="complete-title">Failed to load session</h2>
                    <p class="complete-subtitle">Unable to connect to the server. Please try again.</p>
                    <button class="btn-back-dashboard" id="retryBtn" onclick="loadSession()">
                        <i class="bi bi-arrow-clockwise"></i> Retry
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Answer Submission Module -->
    <script src="../js/answer-submission.js"></script>

    <!-- App Components -->
    <script src="../js/components.js"></script>

    <!-- API Client -->
