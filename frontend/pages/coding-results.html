<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Test Results — VelloxPrep</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/sidebar.css">
</head>
<body>
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="main-content" id="mainContent">
        <header class="topbar">
            <div class="topbar-left">
                <button class="topbar-toggle d-lg-none" id="sidebarToggleBtn"><i class="bi bi-list"></i></button>
                <div>
                    <h1 class="topbar-title">Coding Test Results</h1>
                    <p class="topbar-subtitle">Review your AI-generated feedback</p>
                </div>
            </div>
            <div class="topbar-right">
                <a href="dashboard.html" class="btn btn-primary btn-sm">Back to Dashboard</a>
            </div>
        </header>

        <div class="page-content">
            <div class="container-fluid py-4" style="max-width: 900px;">
                <div class="card glass-panel border-color mb-4">
                    <div class="card-body text-center p-5">
                        <h2 class="display-4 text-primary fw-bold" id="scoreDisplay">--/100</h2>
                        <p class="text-secondary mt-2">Overall Score</p>
                        <div class="badge bg-warning text-dark px-3 py-2 mt-2" id="warningsDisplay" style="font-size: 0.9rem;">
                            Warnings: 0
                        </div>
                    </div>
                </div>

                <h4 class="mb-3">Question Feedback</h4>
                <div id="feedbackContainer">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p class="mt-3 text-secondary">Loading your results...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            Sidebar.init();
            const sessionId = new URLSearchParams(window.location.search).get('id');
            if (!sessionId) return window.location.href = 'dashboard.html';

            try {
                const session = await API.getCodingSessionDetails(sessionId);
                document.getElementById('scoreDisplay').textContent = `${Math.round(session.score || 0)}/100`;
                document.getElementById('warningsDisplay').textContent = `Warnings: ${session.warningCount}`;

                const container = document.getElementById('feedbackContainer');
                container.innerHTML = '';
                
                if (session.codingSubmissions && session.codingSubmissions.length > 0) {
                    session.codingSubmissions.forEach((sub, idx) => {
                        container.innerHTML += `
                            <div class="card glass-panel border-color mb-3">
                                <div class="card-body">
                                    <h5 class="card-title text-primary d-flex justify-content-between">
                                        <span>Question ${idx + 1}</span>
                                        <span class="badge bg-success">${sub.score}/100</span>
                                    </h5>
                                    <div class="bg-dark p-3 rounded mt-3 mb-3 border border-secondary" style="max-height: 200px; overflow-y: auto;">
                                        <pre><code class="text-light">${sub.userCode.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</code></pre>
                                    </div>
                                    <h6 class="text-light">AI Feedback:</h6>
                                    <p class="text-secondary mb-0">${sub.aiFeedback}</p>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = '<p class="text-muted">No submissions found for this test.</p>';
                }
            } catch (err) {
                console.error(err);
                document.getElementById('feedbackContainer').innerHTML = '<p class="text-danger">Failed to load results.</p>';
            }
        });
    </script>
</body>
</html>
