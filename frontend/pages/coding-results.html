<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Performance Optimization -->
    <link rel="preconnect" href="https://velloxprep.onrender.com" crossorigin>
    <link rel="dns-prefetch" href="https://velloxprep.onrender.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Coding Assessment Evaluation Dossier - view AI compiler feedback, unit test passes, and score breakdown.">
    <title>Coding Test Results - VelloxPrep</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/interview.css">

    <!-- Auth Guard and Fetch Interceptor -->
    <script src="../js/auth.js"></script>

    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

    <!-- ── Canvas Neural Network Background ──────────────────────────── -->
    <canvas id="aiNetworkCanvas" class="ai-network-canvas" aria-hidden="true"></canvas>

    <!-- ── Desktop Cursor Ambient Glow ───────────────────────────────── -->
    <div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>

    <!-- ── Atmospheric Vignette ──────────────────────────────────────── -->
    <div class="bg-vignette" aria-hidden="true"></div>

    <!-- ── Reusable Sidebar ──────────────────────────────────────────── -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- ── Sidebar Overlay (Mobile) ──────────────────────────────────── -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- ── Main Content Area ─────────────────────────────────────────── -->
    <div class="main-content" id="mainContent">

        <!-- ── Top Navbar ────────────────────────────────────────────── -->
        <header class="topbar">
            <div class="topbar-left">
                <button class="topbar-toggle d-lg-none" id="sidebarToggleBtn" aria-label="Toggle sidebar">
                    <i class="bi bi-list"></i>
                </button>
                <div>
                    <h1 class="topbar-title">Coding Test Results</h1>
                    <p class="topbar-subtitle">Automated compiler evaluation & AI code review</p>
                </div>
            </div>
            <div class="topbar-right">
                <div class="ai-status-pill">
                    <span class="pulse-dot"></span>
                    <span>Evaluation Finalized</span>
                </div>
                <a href="dashboard.html" class="btn btn-session-nav">
                    <i class="bi bi-speedometer2 me-1"></i> Dashboard
                </a>
            </div>
        </header>

        <!-- ── Page Content ──────────────────────────────────────────── -->
        <div class="page-content">
            <div class="interview-session-container">

                <!-- Score Overview Card -->
                <div class="glass-panel p-4 p-md-5 text-center mb-4 position-relative overflow-hidden">
                    <div class="action-icon-box action-icon-primary mx-auto mb-3" style="width: 72px; height: 72px; font-size: 2rem;">
                        <i class="bi bi-trophy-fill"></i>
                    </div>
                    <h2 class="display-5 fw-bold text-white mb-1" id="scoreDisplay">--/100</h2>
                    <p class="text-secondary small mb-3">Overall Performance Score</p>
                    
                    <div class="d-inline-flex align-items-center gap-2 px-3 py-1.5 rounded-full" style="background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.3); color: #FBBF24; font-size: 0.82rem;" id="warningsDisplay">
                        <i class="bi bi-shield-exclamation"></i> Warnings: 0
                    </div>
                </div>

                <!-- Feedback List -->
                <div class="d-flex align-items-center justify-content-between mb-3">
                    <h4 class="fw-bold mb-0 text-white"><i class="bi bi-journal-code text-accent me-2"></i>Question Feedback Dossier</h4>
                </div>

                <div id="feedbackContainer">
                    <div class="text-center py-5 text-secondary">
                        <div class="spinner-border text-primary mb-3" role="status"></div>
                        <p class="small">Retrieving compiler execution logs...</p>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- App Components -->
    <script src="../js/components.js"></script>
    <script src="../js/api.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof Sidebar !== 'undefined' && typeof Sidebar.init === 'function') {
                Sidebar.init();
            }

            const sessionId = new URLSearchParams(window.location.search).get('id');
            if (!sessionId) return window.location.href = 'dashboard.html';

            try {
                const session = await API.getCodingSessionDetails(sessionId);
                document.getElementById('scoreDisplay').textContent = `${Math.round(session.score || 0)}/100`;
                document.getElementById('warningsDisplay').innerHTML = `<i class="bi bi-shield-exclamation me-1"></i>Proctoring Warnings: ${session.warningCount || 0}`;

                const container = document.getElementById('feedbackContainer');
                container.innerHTML = '';
                
                if (session.codingSubmissions && session.codingSubmissions.length > 0) {
                    session.codingSubmissions.forEach((sub, idx) => {
                        const scoreBadgeClass = sub.score >= 70 ? 'badge-difficulty-easy' : (sub.score >= 40 ? 'badge-difficulty-medium' : 'badge-difficulty-hard');
                        
                        container.innerHTML += `
                            <div class="glass-panel p-4 mb-3 position-relative overflow-hidden">
                                <div class="d-flex align-items-center justify-content-between mb-3">
                                    <h5 class="fw-bold text-white mb-0">Problem ${idx + 1}</h5>
                                    <span class="session-badge ${scoreBadgeClass}">${sub.score}/100</span>
                                </div>
                                <div class="p-3 rounded-3 mb-3" style="background: rgba(10, 14, 24, 0.95); border: 1px solid var(--border-color); max-height: 220px; overflow-y: auto; font-family: 'Fira Code', monospace; font-size: 0.85rem;">
                                    <pre class="mb-0"><code class="text-light">${escapeHtml(sub.userCode || '// No code submitted')}</code></pre>
                                </div>
                                <h6 class="fw-semibold text-white small mb-1"><i class="bi bi-stars text-accent me-1"></i>AI Architectural Feedback:</h6>
                                <p class="text-secondary small mb-0" style="line-height: 1.6;">${escapeHtml(sub.aiFeedback || 'No feedback recorded.')}</p>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = `
                        <div class="glass-panel p-5 text-center text-muted">
                            <i class="bi bi-inbox fs-1 mb-2"></i>
                            <p class="mb-0">No problem submissions recorded for this session.</p>
                        </div>
                    `;
                }
            } catch (err) {
                console.error(err);
                document.getElementById('feedbackContainer').innerHTML = '<div class="alert alert-danger">Failed to load coding test results.</div>';
            }
        });

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
    </script>
</body>
</html>
